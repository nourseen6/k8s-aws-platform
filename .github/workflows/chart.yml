name: Chart

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs so a moved tag can't change what runs.

jobs:
  lint:
    name: Lint and render the chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Lint
        run: helm lint charts/url-shortener --strict

      - name: Render with default values
        run: helm template url-shortener charts/url-shortener -n dev > rendered.yaml

      - name: Render with monitoring (dashboard and alert rules)
        run: helm template url-shortener charts/url-shortener -n dev -f charts/url-shortener/values-local.yaml > /dev/null

      - name: Render with an external database
        run: helm template url-shortener charts/url-shortener -n dev --set postgres.enabled=false --set postgres.externalHost=db.example.internal > /dev/null

  security:
    name: Misconfiguration scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan the chart for HIGH and CRITICAL misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: charts/url-shortener
          severity: HIGH,CRITICAL
          exit-code: "1"
