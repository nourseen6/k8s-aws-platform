apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  labels:
    app: url-shortener
    {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: url-shortener
  template:
    metadata:
      labels:
        app: url-shortener
        {{- include "url-shortener.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "url-shortener.podSecurityContext" . | nindent 8 }}
        # appuser in the Project 1 image
        runAsUser: 10001
        runAsGroup: 10001
      {{- if .Values.postgres.enabled }}
      # Wait for PostgreSQL so the app doesn't crash-loop after a cluster restart.
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U probe; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            {{- include "url-shortener.containerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          securityContext:
            {{- include "url-shortener.containerSecurityContext" . | nindent 12 }}
          lifecycle:
            preStop:
              # Keep serving for a few seconds after the pod is marked for deletion,
              # while the ingress controller removes it from its endpoints.
              # Without this, requests during a rollout can hit a stopping pod (504).
              exec:
                command: ["sleep", "5"]
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "url-shortener.dbHost" . }}:5432/{{ .Values.postgres.database }}"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; /tmp is the only writable path.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener
  labels:
    app: url-shortener
    {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: url-shortener
  ports:
    - port: 80
      targetPort: 8000
