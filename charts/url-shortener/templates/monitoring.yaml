{{- if .Values.monitoring.enabled }}
# Grafana loads this dashboard from any ConfigMap labeled grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: url-shortener-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "url-shortener.labels" . | nindent 4 }}
data:
  url-shortener.json: |
    {{- .Files.Get "files/dashboard.json" | replace "__NAMESPACE__" .Release.Namespace | nindent 4 }}
---
# Alert rules, loaded by the Prometheus Operator.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: url-shortener
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  groups:
    - name: url-shortener
      rules:
        - alert: URLShortenerHighErrorRate
          # More than 5% of backend requests failing with a 5xx status.
          expr: |
            sum(rate(traefik_service_requests_total{exported_service=~"{{ .Release.Namespace }}-url-shortener-.*", code=~"5.."}[2m]))
              /
            sum(rate(traefik_service_requests_total{exported_service=~"{{ .Release.Namespace }}-url-shortener-.*"}[2m]))
              > 0.05
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "More than 5% of requests to the URL shortener API are failing"
            description: "{{`{{ $value | humanizePercentage }}`}} of backend requests returned 5xx over the last 2 minutes. Check the backend logs and the database."
        - alert: URLShortenerReplicasUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="{{ .Release.Namespace }}", deployment=~"url-shortener|frontend"} > 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{`{{ $labels.deployment }}`}} has unavailable replicas"
            description: "{{`{{ $value }}`}} replica(s) of {{`{{ $labels.deployment }}`}} have not been ready for 3 minutes."
        {{- if .Values.postgres.enabled }}
        - alert: URLShortenerDatabaseDown
          expr: kube_statefulset_status_replicas_ready{namespace="{{ .Release.Namespace }}", statefulset="postgres"} < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL has no ready replica"
            description: "postgres-0 has not been ready for 1 minute, so new links can't be saved."
        {{- end }}
{{- end }}
