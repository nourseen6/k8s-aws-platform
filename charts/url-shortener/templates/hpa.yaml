{{- if .Values.backend.autoscaling.enabled }}
# Scale the backend between minReplicas and maxReplicas to keep average CPU
# near the target. The target is a percentage of the CPU request (100m).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: url-shortener
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: url-shortener
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # Wait 2 minutes of low load before removing pods, to avoid flapping.
      stabilizationWindowSeconds: 120
{{- end }}
