<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; color: #1f2328; }
    input, button { font: inherit; padding: .5rem .75rem; }
    input { width: 100%; box-sizing: border-box; margin-bottom: .5rem; }
    #result { margin-top: 1rem; word-break: break-all; }
    small { color: #59636e; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <form id="form">
    <input id="url" type="url" placeholder="https://example.com/a/very/long/link" required>
    <button type="submit">Shorten</button>
  </form>
  <p id="result"></p>
  <small>Frontend on nginx · API on FastAPI · data in PostgreSQL · all on Kubernetes</small>
  <script>
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = document.getElementById("result");
      const response = await fetch("/api/shorten", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: document.getElementById("url").value }),
      });
      if (!response.ok) {
        result.textContent = "Error " + response.status;
        return;
      }
      const { code } = await response.json();
      const link = location.origin + "/api/" + code;
      result.innerHTML = 'Short link: <a href="' + link + '">' + link + "</a>";
    });
  </script>
</body>
</html>
